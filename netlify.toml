[build]
  command = "pip install -r requirements.txt && python manage.py collectstatic --noinput"
  functions = "netlify/functions"
  publish = "staticfiles"

[build.environment]
  PYTHON_VERSION = "3.12"

[functions]
  node_bundler = "esbuild"
  included_files = ["requirements.txt"]

[functions.wsgi_handler]
  external_node_modules = ["serverless-wsgi"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/wsgi_handler"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
