<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background: #0A0A1A; color: #E2E8F0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .code { font-size: 32px; font-weight: bold; text-align: center; color: #00D4FF; letter-spacing: 8px; padding: 20px; background: rgba(0,212,255,0.1); border-radius: 12px; margin: 20px 0; }
        .footer { text-align: center; color: #94A3B8; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center; color:#8B5CF6;">AI Academy</h2>
        <p>Hola <strong>{{ user.username }}</strong>,</p>
        <p>Recibimos una solicitud para restablecer tu contraseña. Usa el siguiente código:</p>
        <div class="code">{{ code }}</div>
        <p>Este código expira en 15 minutos.</p>
        <p>Si no solicitaste esto, ignora este mensaje.</p>
        <div class="footer">&copy; {% now "Y" %} AI Academy</div>
    </div>
</body>
</html>
