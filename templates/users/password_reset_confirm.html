{% extends 'base.html' %}
{% load static %}

{% block title %}Nueva Contraseña - AI Academy{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card ai-scan">
                <div class="card-header text-center">
                    <div class="ai-pulse-ring d-inline-flex mb-2" style="width:32px;height:32px;">
                        <i class="fas fa-lock ai-brain-glow"></i>
                    </div>
                    <h4 class="mt-2">Nueva Contraseña</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_password1" class="form-label"><i class="fas fa-key me-1"></i>Nueva contraseña</label>
                            <input type="password" name="password1" class="form-control" id="id_password1" minlength="6" placeholder="••••••" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_password2" class="form-label"><i class="fas fa-key me-1"></i>Confirmar contraseña</label>
                            <input type="password" name="password2" class="form-control" id="id_password2" minlength="6" placeholder="••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-ai-processing">
                            <i class="fas fa-save"></i> Restablecer Contraseña
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
