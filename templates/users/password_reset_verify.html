{% extends 'base.html' %}
{% load static %}

{% block title %}Verificar Código - AI Academy{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card ai-scan">
                <div class="card-header text-center">
                    <div class="ai-pulse-ring d-inline-flex mb-2" style="width:32px;height:32px;">
                        <i class="fas fa-shield-alt ai-brain-glow"></i>
                    </div>
                    <h4 class="mt-2">Verificar Código</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted"><i class="fas fa-envelope me-1"></i>Ingresa el código de 6 dígitos enviado a tu correo y teléfono.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_code" class="form-label"><i class="fas fa-hashtag me-1"></i>Código de verificación</label>
                            <input type="text" name="code" class="form-control" id="id_code" maxlength="6" pattern="\d{6}" inputmode="numeric" required placeholder="000000">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-ai-processing">
                            <i class="fas fa-check"></i> Verificar
                        </button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">
                        <a href="{% url 'users:password_reset_request' %}"><i class="fas fa-arrow-left"></i> Solicitar nuevo código</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
