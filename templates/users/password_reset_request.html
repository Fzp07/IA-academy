{% extends 'base.html' %}
{% load static %}

{% block title %}Recuperar Contraseña - AI Academy{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card ai-scan">
                <div class="card-header text-center">
                    <div class="ai-pulse-ring d-inline-flex mb-2" style="width:32px;height:32px;">
                        <i class="fas fa-key ai-brain-glow"></i>
                    </div>
                    <h4 class="mt-2">Recuperar Contraseña</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted"><i class="fas fa-info-circle me-1"></i>Ingresa tu nombre de usuario para recibir un código de verificación.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label"><i class="fas fa-user me-1"></i>Usuario</label>
                            <input type="text" name="username" class="form-control" id="id_username" placeholder="Tu usuario" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-ai-processing">
                            <i class="fas fa-paper-plane"></i> Enviar Código
                        </button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">
                        <a href="{% url 'users:login' %}"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
