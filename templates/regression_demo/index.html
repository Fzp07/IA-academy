{% extends 'base.html' %}
{% load static %}

{% block title %}Regresión Lineal - AI Academy{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card ai-scan">
                <div class="card-header">
                    <div class="d-flex align-items-center gap-2">
                        <span class="ai-pulse-ring" style="width:24px;height:24px;">
                            <i class="fas fa-chart-line ai-brain-glow"></i>
                        </span>
                        <h4 class="mb-0">Demo de Regresión Lineal</h4>
                    </div>
                </div>
                <div class="card-body">
                    <p>📊 Sube un archivo CSV y selecciona las columnas para realizar un análisis de regresión lineal con IA.</p>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="csv_file" class="form-label"><i class="fas fa-file-csv me-1"></i>Archivo CSV</label>
                            <input type="file" class="form-control" id="csv_file" name="csv_file" accept=".csv" required>
                        </div>
                        <div class="mb-3">
                            <label for="x_column" class="form-label"><i class="fas fa-arrow-right me-1"></i>Columna X (variable independiente)</label>
                            <input type="text" class="form-control" id="x_column" name="x_column" placeholder="Ej: edad" required>
                        </div>
                        <div class="mb-3">
                            <label for="y_column" class="form-label"><i class="fas fa-arrow-left me-1"></i>Columna Y (variable dependiente)</label>
                            <input type="text" class="form-control" id="y_column" name="y_column" placeholder="Ej: precio" required>
                        </div>
                        <div class="mb-3">
                            <label for="test_size" class="form-label"><i class="fas fa-sliders me-1"></i>Tamaño de prueba (0.0 - 1.0)</label>
                            <input type="number" class="form-control" id="test_size" name="test_size" step="0.05" min="0.1" max="0.5" value="0.2">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-ai-processing">
                            <i class="fas fa-play"></i> Analizar con IA
                        </button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <div class="ai-frequency justify-content-center">
                    <span style="height:30%;"></span>
                    <span style="height:60%;"></span>
                    <span style="height:45%;"></span>
                    <span style="height:80%;"></span>
                    <span style="height:55%;"></span>
                    <span style="height:70%;"></span>
                    <span style="height:35%;"></span>
                    <span style="height:65%;"></span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
